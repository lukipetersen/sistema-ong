services:
  postgres:
    image: postgres:16-alpine
    container_name: ong_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ong
      POSTGRES_PASSWORD: ong_dev_2024
      POSTGRES_DB: sistema_ong
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong -d sistema_ong"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ong_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://ong:ong_dev_2024@postgres:5432/sistema_ong
      NODE_ENV: production
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: ong_postgres_data
