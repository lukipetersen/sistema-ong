services:

  postgres:
    image: postgres:16-alpine
    container_name: ong_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ong
      POSTGRES_PASSWORD: ong_dev_2024
      POSTGRES_DB: sistema_ong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ong -d sistema_ong"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ong_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ong:ong_dev_2024@postgres:5432/sistema_ong
      DIRECT_URL: postgresql://ong:ong_dev_2024@postgres:5432/sistema_ong
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ong_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: ong_postgres_data
