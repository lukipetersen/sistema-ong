databases:
  - name: sistema-ong-db
    plan: basic
    databaseName: sistema_ong
    user: ong

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  - type: web
    name: sistema-ong-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-ong-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: sistema-ong-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: sistema-ong-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
